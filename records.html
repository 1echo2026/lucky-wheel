<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FDFAF6">
<title>抽奖记录 · 宠粉日</title>
<style>
/* ============================================================
   暖橙简约 · 与抽奖页同一套令牌
   ============================================================ */
:root {
  --brand-900:#5C3218; --brand-800:#8A4620; --brand-700:#A85A22; --brand-600:#C9762F; --brand-500:#DE9852; --brand-300:#F0CDA6; --brand-200:#F7E3CD; --brand-100:#FDF3E7;
  --accent:#D9B36A; --bg:#FDFAF6; --surface:#FFFFFF; --surface-2:#FBF5EE;
  --ink:#2E241C; --ink-soft:#8A7A6D; --ink-faint:#B5A79A;
  --line:#EFE4D8; --line-2:#E5D6C6;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(92,50,24,.05); --shadow-2:0 10px 28px rgba(92,50,24,.07);
  --font-sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --font-serif:"Songti SC","STSong","SimSun",serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  font-size: 15px;
  color: var(--ink);
  min-height: 100vh;
  background-color: var(--bg);
  -webkit-tap-highlight-color: transparent;
  overflow-wrap: anywhere;
}
.bg-layer {
  position: fixed; inset: 0; z-index: -1; display: none;
  background-size: cover; background-position: center top; background-repeat: no-repeat;
}
.bg-layer::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(253,250,246,.88) 0%, rgba(253,250,246,.74) 42%, rgba(253,250,246,.90) 100%);
}
body.has-bg .bg-layer { display: block; }

.wrap {
  position: relative; z-index: 1;
  max-width: 520px; margin: 0 auto;
  padding: 0 16px calc(32px + env(safe-area-inset-bottom));
}

/* 页头 */
.head {
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--line); border-bottom: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  margin: 0 0 16px;
  padding: 20px 16px 18px;
}
.head .seal {
  display: inline-block; padding: 4px 12px; border-radius: var(--r-pill);
  font-family: var(--font-serif); font-size: 12px; font-weight: 600; letter-spacing: .5px;
  color: var(--brand-700); background: var(--brand-100);
  border: 1px solid #F0D9BC;
}
.head h1 {
  margin-top: 10px;
  font-family: var(--font-serif); font-size: 26px; font-weight: 700; letter-spacing: 3px;
  color: var(--brand-900);
}
.head .meta {
  margin-top: 8px; font-size: 12.5px; letter-spacing: .3px;
  color: var(--ink-soft);
}

/* 白卡 */
.card {
  background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-2);
}
.card h2 {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-serif); font-size: 15px; font-weight: 700; letter-spacing: .5px;
  color: var(--brand-800);
}
.card h2::before {
  content: ''; width: 3px; height: 14px; flex: 0 0 auto; border-radius: 2px;
  background: var(--brand-600);
}
.card .sub { font-size: 12.5px; color: var(--ink-soft); margin: 8px 0 16px; line-height: 1.7; }
.card .sub b { color: var(--brand-700); font-weight: 700; }

/* 记录分组 */
.rec-group { margin-bottom: 16px; }
.rec-group:last-child { margin-bottom: 0; }
.rec-group + .rec-group {
  border-top: 1px solid var(--line);
  padding-top: 16px;
}
.rec-head {
  display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
  padding: 6px 12px; margin-bottom: 12px;
  font-size: 13px; font-weight: 600; letter-spacing: .5px;
  color: var(--brand-700); background: var(--brand-100);
  border: 1px solid #F0D9BC; border-radius: var(--r-pill);
}
.rec-head .cnt {
  flex: 0 0 auto; font-size: 11.5px; font-weight: 600;
  color: var(--brand-600); background: var(--surface); border: 1px solid var(--line-2);
  border-radius: var(--r-pill); padding: 1px 8px;
}
.rec-row {
  padding: 14px 16px; border-radius: var(--r-md); margin-bottom: 10px;
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: var(--shadow-1);
}
.rec-row:last-child { margin-bottom: 0; }
.rec-row .rec-prize {
  font-size: 14px; font-weight: 700; color: var(--brand-800); line-height: 1.45;
}
.rec-row .rec-meta {
  margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 14px;
  font-size: 12.5px; color: var(--ink-soft);
}
.rec-row .rec-meta .k { color: var(--ink-faint); }
.rec-empty { text-align: center; font-size: 14px; color: var(--ink-faint); padding: 22px 0; line-height: 1.9; }

/* 按钮 */
.btn {
  width: 100%; height: 50px; border: 0; border-radius: var(--r-md);
  background: linear-gradient(180deg, var(--brand-500), var(--brand-600));
  color: #FFF; font-family: var(--font-sans);
  font-size: 16px; font-weight: 600; letter-spacing: 1px; cursor: pointer;
  box-shadow: var(--shadow-2);
  transition: transform .12s ease, filter .18s ease;
}
.btn-link { display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box; }
.btn:hover { filter: brightness(1.04); }
.btn:active { transform: translateY(1px); }
:focus-visible { outline: 2px solid var(--brand-600); outline-offset: 2px; }

.footer {
  text-align: center; font-size: 12px; line-height: 1.7;
  color: var(--ink-faint); margin-top: 16px;
}
.footer a {
  color: var(--brand-700); text-decoration: none;
  border-bottom: 1px solid var(--line-2); padding-bottom: 1px;
}
@media (max-width: 520px) {
  .head {
    margin: 0 -16px 16px;
    border-left: 0; border-right: 0; border-radius: 0;
  }
}
@media (max-width: 360px) {
  .head h1 { font-size: 23px; letter-spacing: 2px; }
}
</style>
</head>
<body>
<div class="bg-layer" id="bgLayer"></div>

<div class="wrap">

  <header class="head">
    <span class="seal" id="periodBadge">抽奖记录</span>
    <h1>抽奖记录</h1>
    <div class="meta" id="headMeta">加载中…</div>
  </header>

  <section class="card">
    <h2>本期及往期记录</h2>
    <div class="sub" id="sumLine">每期抽奖记录都会保留</div>
    <div id="recList"></div>
  </section>

  <a class="btn btn-link" href="index.html">返回抽奖页</a>

  <div class="footer">
    手机号已打码，仅显示前后各 3 位<br>
    记录保存在参与抽奖的那台设备上
  </div>
</div>

<script>
(function () {
  'use strict';
  var LS_KEY = 'lw_config', LS_REC = 'lw_records';
  var PUBLISHED_BG = 'assets/bg.jpg';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function fmtDate(d) {
    if (!d) return '';
    var t = new Date(d), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate())
      + ' ' + p(t.getHours()) + ':' + p(t.getMinutes());
  }
  function maskPhone(p) {
    var s = String(p || '');
    return s.length === 11 ? s.slice(0, 3) + '****' + s.slice(7) : (s || '—');
  }
  function getConfig() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function getRecords() {
    try { return JSON.parse(localStorage.getItem(LS_REC) || '[]'); } catch (e) { return []; }
  }
  function paintBg(src) {
    $('bgLayer').style.backgroundImage = 'url("' + src + '")';
    document.body.classList.add('has-bg');
  }
  function applyBg() {
    var probe = new Image();
    probe.onload = function () { paintBg(PUBLISHED_BG); };
    probe.onerror = function () {
      if (cfg.bgUrl) paintBg(cfg.bgUrl);
    };
    probe.src = PUBLISHED_BG;
  }

  var cfg = getConfig();
  var records = getRecords();

  $('periodBadge').textContent = cfg.period || '抽奖记录';

  /* 头部摘要：总条数 + 最近一次时间 */
  var last = records.length ? records[records.length - 1].submitTime : '';
  $('headMeta').textContent = records.length
    ? '共 ' + records.length + ' 条记录 · 最近一次 ' + fmtDate(last)
    : '暂无记录';

  /* 按期数 + 奖池分组，最新在前 */
  var keys = [], map = {};
  records.slice().reverse().forEach(function (r) {
    var k = (r.period || '未命名期数') + ' · ' + (r.pool || cfg.poolName || '奖池');
    if (!map[k]) { map[k] = []; keys.push(k); }
    map[k].push(r);
  });

  if (!keys.length) {
    $('sumLine').textContent = '暂无记录';
    $('recList').innerHTML = '<div class="rec-empty">还没有抽奖记录<br>去抽奖页参与一次，记录就会出现在这里</div>';
  } else {
    $('sumLine').innerHTML = '共 <b>' + records.length + '</b> 条记录，按「期数 · 奖池」分组';
    var html = '';
    keys.forEach(function (k) {
      html += '<div class="rec-group"><div class="rec-head">' + esc(k)
        + '<span class="cnt">' + map[k].length + ' 条</span></div>';
      map[k].forEach(function (r) {
        html += '<div class="rec-row">'
          + '<div class="rec-prize">' + esc(r.prize || '—') + '</div>'
          + '<div class="rec-meta">'
          + '<span><span class="k">抽奖时间</span> ' + fmtDate(r.submitTime) + '</span>'
          + '<span><span class="k">出单手机号</span> ' + esc(maskPhone(r.phone)) + '</span>'
          + '</div></div>';
      });
      html += '</div>';
    });
    $('recList').innerHTML = html;
  }

  applyBg();
})();
</script>
</body>
</html>
